<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    
     
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
     
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
         
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

         
        body {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);  
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            text-align: center;
            overflow: hidden;
        }

         
        .error-container {
            padding: 2rem;
            animation: fadeIn 1s ease-in-out;
        }

         
        .error-code {
            font-size: 10rem;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 1rem;
            text-shadow: 0 15px 30px rgba(0,0,0,0.3);
            animation: float 5s ease-in-out infinite;  
        }

        .error-code i {
            color: #ff6b6b;  
            font-size: 8rem;
            animation: slowSpin 10s linear infinite;  
        }

         
        .error-title {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }

        .error-message {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 2.5rem;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }

         
        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            background-color: #ff6b6b;
            color: #ffffff;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3);
        }

        .home-btn:hover {
            transform: translateY(-5px);
            background-color: #ff4757;
            box-shadow: 0 15px 25px rgba(255, 107, 107, 0.5);
        }

         
        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }

        @keyframes slowSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

         
        @media (max-width: 768px) {
            .error-code {
                font-size: 7rem;
            }
            .error-code i {
                font-size: 5.5rem;
            }
            .error-title {
                font-size: 1.8rem;
            }
            .error-message {
                font-size: 1rem;
                padding: 0 15px;
            }
        }

        @media (max-width: 480px) {
            .error-code {
                font-size: 5rem;
            }
            .error-code i {
                font-size: 4rem;
            }
            .error-title {
                font-size: 1.5rem;
            }
            .home-btn {
                padding: 0.8rem 2rem;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="error-container">
         
        <h1 class="error-code">4<i class="fa-solid fa-cookie-bite"></i>4</h1>
        <h2 class="error-title">Oops! Page Not Found</h2>
        <p class="error-message">Looks like this recipe is missing from our cookbook. Don't worry, let's get you back to the main menu.</p>
        
         
        <a href="index.html" class="home-btn">
            <i class="fa-solid fa-house"></i> Go to Home
        </a>
    </div>

</body>
</html>
